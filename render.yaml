# Render Blueprint: the Next.js web service (which also runs the engine tick), Postgres 16, and a
# cron job that calls the sweep endpoint. Fields follow https://render.com/docs/blueprint-spec as
# of Nov 2026, which names plans by size: 0.5c-512mb was "Starter", 0.1c-256mb was "Basic-256mb".

services:
  - type: web
    name: fairhold
    runtime: node # version from .node-version
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/healthz
    # Deploy a commit only after its GitHub checks (CI and the secret scan) pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fairhold-db
          property: connectionString
      - key: ENGINE_ENABLED
        value: "true"
      - key: PAYMENTS_MODE
        value: sandbox
      - key: PAYPAL_ENV
        value: sandbox
      - key: GLIM_MODE
        value: live
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Prompted once, when the Blueprint is first applied.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Added later in the dashboard (Render keeps variables a Blueprint does not list):
      # PAYPAL_WEBHOOK_ID and DEMO_BUYER_{1,2,3}_{EMAIL,PASSWORD} once the webhook and sandbox
      # buyers exist, and NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY before the build that needs it.

  - type: cron
    name: fairhold-sweep
    runtime: node
    plan: 0.5c-512mb # the smallest cron plan
    region: oregon # same region as the web service, for the private network
    schedule: "*/15 * * * *"
    # The job is one curl call, so there is nothing to build, and the filter keeps app commits
    # from redeploying it.
    buildCommand: "true"
    buildFilter:
      paths:
        - render.yaml
    startCommand: >-
      curl --fail-with-body --silent --show-error --max-time 300 --retry 3 --retry-connrefused
      -X POST -H "Authorization: Bearer $CRON_SECRET"
      "http://$FAIRHOLD_WEB_HOSTPORT/api/cron/sweep"
    envVars:
      - key: FAIRHOLD_WEB_HOSTPORT
        fromService:
          type: web
          name: fairhold
          property: hostport
      - key: CRON_SECRET
        fromService:
          type: web
          name: fairhold
          envVarKey: CRON_SECRET

databases:
  - name: fairhold-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"
    # Render's default for this tier is 15 GB; the demo needs well under 1 GB.
    diskSizeGB: 1
    databaseName: fairhold
    user: fairhold
